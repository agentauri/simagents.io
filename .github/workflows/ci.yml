# GitHub Actions workflow for CI
# Runs on all PRs and pushes to main branch

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.14"
  NODE_VERSION: "24.11.1"
  # Public production configuration only; server secrets are never build inputs.
  VITE_OFFICIAL_RELAY_URL: "https://relay.simagents.io"
  VITE_ADMISSION_URL: "https://admission.simagents.io"
  VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAFNSn4rIOBb4XcTN"

jobs:
  # ============================================================================
  # Job 1: Lint and Type Check (fast feedback)
  # ============================================================================
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit locked application dependencies
        run: node scripts/audit-dependencies.mjs

      - name: Typecheck all packages
        run: bun run typecheck

      - name: Lint all packages
        run: bun run lint

  # ============================================================================
  # Job 2: Engine Tests
  # ============================================================================
  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup pinned Node.js for release checks
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run engine and local release/manifest tests
        run: |
          bun run test
          node --test scripts/release-gates.test.mjs scripts/provider-attempt-journal.test.mjs
          bun scripts/check-provider-manifest.mjs

  # ============================================================================
  # Job 3: Build Web Frontend
  # ============================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Vite build
        uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        working-directory: apps/web
        run: npm run build

      - name: Verify browser-only bundle (no backend leakage)
        run: node scripts/check-browser-bundle.mjs

      - name: Bind candidate to bundle, relay, catalog and schemas
        run: |
          bun run --filter @simagents/relay build
          bun run --filter @simagents/admission build
          node scripts/release-candidate.mjs
          node scripts/release-candidate.mjs --verify

      - name: Upload admission candidate
        uses: actions/upload-artifact@v7
        with:
          name: admission-dist
          path: apps/admission/dist
          retention-days: 90

      - name: Upload relay candidate
        uses: actions/upload-artifact@v7
        with:
          name: relay-dist
          path: apps/relay/dist
          retention-days: 90

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 90

  # ============================================================================
  # Job 4: Browser Smoke
  # ============================================================================
  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y
          npm install playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit

      - name: Download the production candidate
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Download relay candidate
        uses: actions/download-artifact@v4
        with:
          name: relay-dist
          path: apps/relay/dist

      - name: Download admission candidate
        uses: actions/download-artifact@v4
        with:
          name: admission-dist
          path: apps/admission/dist

      - name: Verify downloaded candidate
        run: node scripts/release-candidate.mjs --verify

      - name: Start web server
        run: |
          cd apps/web
          VITE_INTERNAL_TESTS=true bun run dev -- --host 127.0.0.1 --port 5175 > "$RUNNER_TEMP/simagents-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simagents-vite.pid"
          bun run preview -- --host 127.0.0.1 --port 5176 > "$RUNNER_TEMP/simagents-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simagents-preview.pid"

      - name: Wait for web server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5175/ >/dev/null && curl -fsS http://127.0.0.1:5176/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/simagents-vite.log"
          exit 1

      - name: Run browser smoke
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/playwright/node_modules/playwright
          SIMAGENTS_SMOKE_URL: http://127.0.0.1:5175/
        run: node scripts/browser-smoke.mjs

      - name: Production BYOK and credential smoke
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/playwright/node_modules/playwright
          SIMAGENTS_SMOKE_URL: http://127.0.0.1:5176/
        run: |
          for browser in chromium firefox webkit; do
            export SIMAGENTS_SMOKE_BROWSER="$browser"
            bun scripts/storage-budget-browser.ts
            node scripts/header-smoke.mjs
            for language in en it; do
              export SIMAGENTS_SMOKE_LANGUAGE="$language"
              node scripts/keyboard-smoke.mjs
              for width in 1440 768 390; do
                SIMAGENTS_SMOKE_WIDTH="$width" bun scripts/public-data-smoke.ts
                SIMAGENTS_SMOKE_WIDTH="$width" node scripts/public-ui-smoke.mjs
                SIMAGENTS_SMOKE_WIDTH="$width" SIMAGENTS_SMOKE_NATIVE_ZOOM=2 node scripts/public-ui-smoke.mjs
              done
              node scripts/accessibility-smoke.mjs
              node scripts/credential-smoke.mjs
              node scripts/byok-production-smoke.mjs
              node scripts/connection-profile-smoke.mjs
              node scripts/setup-smoke.mjs
              SIMAGENTS_SMOKE_WIDTH=390 node scripts/setup-smoke.mjs
            done
          done

      - name: Injected browser storage-denial handling
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/playwright/node_modules/playwright
          SIMAGENTS_SMOKE_URL: http://127.0.0.1:5176/
        run: |
          for language in en it; do
            SIMAGENTS_SMOKE_LANGUAGE="$language" bun scripts/storage-fault-smoke.ts
          done

      - name: Install pinned local Cloudflare runtime
        run: |
          npm ci --prefix scripts/fixtures/cloudflare-runtime
          npm audit --prefix scripts/fixtures/cloudflare-runtime --audit-level=high

      - name: Local workerd entrypoints, SQLite quotas and real alarm
        env:
          MINIFLARE_MODULE_DIR: ${{ github.workspace }}/scripts/fixtures/cloudflare-runtime/node_modules/miniflare
        run: node scripts/cloudflare-runtime-smoke.mjs

      - name: Autonomous admission on the same production SPA artifact
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/playwright/node_modules/playwright
          SIMAGENTS_ADMISSION_TEST_DIST: apps/web/dist
          SIMAGENTS_ADMISSION_TEST_APP_ORIGIN: https://app.simagents.io
        run: |
          for browser in chromium firefox webkit; do
            for language in en it; do
              for width in 1440 768 390; do
                SIMAGENTS_SMOKE_BROWSER="$browser" SIMAGENTS_SMOKE_LANGUAGE="$language" SIMAGENTS_SMOKE_WIDTH="$width" bun scripts/admission-browser-smoke.ts
              done
            done
          done

      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            .tmp/public-data
            .tmp/storage-faults
            .tmp/storage-budget-driver/*-report.json
            .tmp/public-ui
            .tmp/admission-browser
            .tmp/cloudflare-runtime-evidence
            .tmp/keyboard
            .tmp/setup
            .tmp/header
            .tmp/accessibility
            ${{ runner.temp }}/simagents-*.log
          retention-days: 90

      - name: Stop web server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/simagents-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/simagents-vite.pid")" || true
          fi
          if [ -f "$RUNNER_TEMP/simagents-preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/simagents-preview.pid")" || true
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm audit --audit-level=high
        working-directory: docs-site
      - run: node --test scripts/braces-security.test.mjs
      - run: npm run build
        working-directory: docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs-site/build
          retention-days: 90

  # ============================================================================
  # Job 5: CI Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-typecheck, engine-tests, build-web, browser-smoke, docs]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Typecheck | ${{ needs.lint-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine Tests | ${{ needs.engine-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Web | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Smoke | ${{ needs.browser-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.lint-typecheck.result != 'success' ||
          needs.engine-tests.result != 'success' ||
          needs.build-web.result != 'success' ||
          needs.browser-smoke.result != 'success' ||
          needs.docs.result != 'success'
        run: |
          echo "One or more CI jobs failed"
          exit 1
