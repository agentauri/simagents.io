# GitHub Actions workflow for CI
# Runs on all PRs and pushes to main branch

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.1.42"
  NODE_VERSION: "24"

jobs:
  # ============================================================================
  # Job 1: Lint and Type Check (fast feedback)
  # ============================================================================
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck all packages
        run: bun run typecheck

      # Uncomment when ESLint is configured
      # - name: Lint all packages
      #   run: bun run lint

  # ============================================================================
  # Job 2: Engine Tests
  # ============================================================================
  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run engine test suite
        run: bun run --filter @simagents/engine test

  # ============================================================================
  # Job 3: Build Web Frontend
  # ============================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Vite build
        uses: actions/cache@v6
        with:
          path: apps/web/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        working-directory: apps/web
        run: npm run build

      - name: Verify browser-only bundle (no backend leakage)
        working-directory: apps/web
        run: |
          if grep -rEl "fastify|postgres|redis|bullmq|drizzle|@server|/api/|EventSource" dist; then
            echo "::error::Backend-only code leaked into the browser bundle"
            exit 1
          fi
          echo "Bundle is clean (browser-only)."

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ============================================================================
  # Job 4: Browser Smoke
  # ============================================================================
  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y
          npm install playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Start web server
        run: |
          cd apps/web
          bun run dev -- --host 127.0.0.1 --port 5175 > "$RUNNER_TEMP/simagents-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simagents-vite.pid"

      - name: Wait for web server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5175/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/simagents-vite.log"
          exit 1

      - name: Run browser smoke
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/playwright/node_modules/playwright
          SIMAGENTS_SMOKE_URL: http://127.0.0.1:5175/
        run: node scripts/browser-smoke.mjs

      - name: Stop web server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/simagents-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/simagents-vite.pid")" || true
          fi

  # ============================================================================
  # Job 5: CI Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-typecheck, engine-tests, build-web, browser-smoke]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Typecheck | ${{ needs.lint-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine Tests | ${{ needs.engine-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Web | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Smoke | ${{ needs.browser-smoke.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.lint-typecheck.result == 'failure' ||
          needs.engine-tests.result == 'failure' ||
          needs.build-web.result == 'failure' ||
          needs.browser-smoke.result == 'failure'
        run: |
          echo "One or more CI jobs failed"
          exit 1
