# GitHub Actions workflow for releases
# Creates GitHub releases and triggers production deployment

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      create_tag:
        description: 'Create git tag for this version'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  BUN_VERSION: "1.2.14"

jobs:
  # ============================================================================
  # Job 0: Verify gates (must pass before a release is published)
  # ============================================================================
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"

      - name: Require candidate release evidence
        env:
          SIMAGENTS_RELEASE_EVIDENCE: ${{ vars.SIMAGENTS_RELEASE_EVIDENCE }}
          SIMAGENTS_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/check-release-gates.mjs

      - name: Verify the exact successful CI run
        id: candidate-ci
        env:
          SIMAGENTS_RELEASE_EVIDENCE: ${{ vars.SIMAGENTS_RELEASE_EVIDENCE }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-ci-candidate.mjs

      - name: Download the tested web candidate
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate-ci.outputs.run-id }}

      - name: Download the tested relay candidate
        uses: actions/download-artifact@v4
        with:
          name: relay-dist
          path: apps/relay/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate-ci.outputs.run-id }}

      - name: Download the tested admission candidate
        uses: actions/download-artifact@v4
        with:
          name: admission-dist
          path: apps/admission/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate-ci.outputs.run-id }}

      - name: Verify tested candidate identity and all artifact hashes
        env:
          SIMAGENTS_RELEASE_EVIDENCE: ${{ vars.SIMAGENTS_RELEASE_EVIDENCE }}
        run: |
          node scripts/release-candidate.mjs --verify
          node scripts/check-browser-bundle.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const candidate = JSON.parse(readFileSync('apps/web/dist/candidate.json', 'utf8'));
          const evidence = JSON.parse(process.env.SIMAGENTS_RELEASE_EVIDENCE);
          if (candidate.identity.dirty || candidate.id !== evidence.candidateId) throw new Error('Release evidence does not match the clean tested artifact.');
          NODE

      - name: Package the verified artifacts for retention
        run: |
          (cd apps/web/dist && zip -r ../../../web-candidate.zip .)
          (cd apps/relay/dist && zip -r ../../../relay-candidate.zip .)
          (cd apps/admission/dist && zip -r ../../../admission-candidate.zip .)

      - name: Retain verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-candidate
          path: '*-candidate.zip'
          retention-days: 90

  # ============================================================================
  # Job 1: Create Release
  # ============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_created: ${{ steps.tag.outputs.created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$RELEASE_REF"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)([.-][0-9]+)?)?$ ]]; then
            echo "Invalid release version"
            exit 1
          fi

          # Ensure version starts with 'v'
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create tag (if manual dispatch)
        id: tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.version }} already exists"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
            git push origin "${{ steps.version.outputs.version }}"
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Created tag: ${{ steps.version.outputs.version }}"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous tag found, including recent commits"
            git log --pretty=format:"- %s (%h)" -20 >> changelog.md
          else
            echo "Previous tag: $PREV_TAG"
            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> changelog.md
            echo "" >> changelog.md
            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}" >> changelog.md
          fi

      - name: Download verified candidate packages
        uses: actions/download-artifact@v4
        with:
          name: verified-release-candidate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: |
            web-candidate.zip
            relay-candidate.zip
            admission-candidate.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc') }}
          generate_release_notes: true

  # ============================================================================
  # Job 2: Post-release summary
  # ============================================================================
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.create-release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Created | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Release artifacts are retained here. Verify the live deployment separately at https://app.simagents.io." >> $GITHUB_STEP_SUMMARY
