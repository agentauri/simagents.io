name = "simagents-admission"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2026-10-04"
account_id = "f7f02ae9a218a57974d176a3eaaaca90"
workers_dev = false
preview_urls = false
[observability]
enabled = false
[vars]
ALLOWED_ORIGINS = "https://app.simagents.io"
TURNSTILE_HOSTNAMES = "app.simagents.io"
# AUTH_SECRET and TURNSTILE_SECRET are secrets; no provider credentials belong here.
[[durable_objects.bindings]]
name = "SUBJECT_QUOTAS"
class_name = "SubjectQuota"
script_name = "simagents-relay"
[[ratelimits]]
name = "ADMISSION_LIMITER"
namespace_id = "19003"
[ratelimits.simple]
limit = 10
period = 60

[[routes]]
pattern = "admission.simagents.io"
custom_domain = true
